version: '3.8'

services:
  petclinic-db:
    image: mysql:8.0
    container_name: petclinic-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass_secure
      - MYSQL_DATABASE=petclinic
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic_pass
    volumes:
      - petclinic-db-data:/var/lib/mysql
    networks:
      - petclinic-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  petclinic-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-petclinic:enterprise
    container_name: petclinic-web
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://petclinic-db:3306/petclinic?useUnicode=true
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=petclinic_pass
    depends_on:
      petclinic-db:
        condition: service_healthy
    networks:
      - petclinic-net
    restart: always

networks:
  petclinic-net:
    driver: bridge

volumes:
  petclinic-db-data:
